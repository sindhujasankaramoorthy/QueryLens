name: CI/CD Pipeline - Test & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          npm install --prefix client --include=dev
          npm install --prefix server

      - name: Run Server Unit & Integration Test Suites
        run: npm test --prefix server

      - name: Build Client Frontend Bundle
        run: npm run build --prefix client

      - name: Trigger Render Deploy Hook (if secret configured)
        if: success() && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "No RENDER_DEPLOY_HOOK_URL secret set; relying on Render Auto-Deploy."
          fi
